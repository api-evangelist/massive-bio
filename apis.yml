name: Massive Bio
description: Massive Bio is an AI-powered healthcare company that matches cancer patients
  with clinical trials. Its platform analyzes 500+ medical data elements — diagnosis,
  genomic profile, and clinical history — to deliver personalized trial-match reports
  within 24 hours, connecting patients, physicians, pharmaceutical sponsors, and research
  institutions. Products include a patient-facing matching service, the Trial Relay
  physician screening and referral tool, and iOS/Android mobile apps. The company reports
  200,000+ registered patients and coverage of 19,000+ active oncology and hematology
  trials across multiple international markets. Massive Bio does not currently publish
  a public API, SDK, or developer portal.
